name: pulse
description: "LumaWave - Premium 3D Immersive Music Discovery and Playback Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Audio Streaming & Engine
  just_audio: ^0.9.36

  # Networking, Images & Utilities
  http: ^1.2.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2

  # UI, Icons, Typography & Effects
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  supabase_flutter: ^2.18.3
  dart_des: ^1.0.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
